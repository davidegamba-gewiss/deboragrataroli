<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <defs>
    <!-- Purple gradient background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5E2CA5;stop-opacity:0.05" />
      <stop offset="50%" style="stop-color:#7B3CBF;stop-opacity:0.08" />
      <stop offset="100%" style="stop-color:#A86BD9;stop-opacity:0.05" />
    </linearGradient>

    <!-- Star shape for glitter particles -->
    <path id="star" d="M0,-2 L0.6,-0.6 L2,0 L0.6,0.6 L0,2 L-0.6,0.6 L-2,0 L-0.6,-0.6 Z"/>

    <!-- Circle for sparkle -->
    <circle id="sparkle" r="1.5"/>
  </defs>

  <!-- Background -->
  <rect width="1000" height="1000" fill="url(#bgGradient)"/>

  <!-- Glitter particles - Stars -->
  <use href="#star" x="120" y="80" fill="#E2C7FF" opacity="0.6" transform="scale(1.5)"/>
  <use href="#star" x="450" y="150" fill="#A86BD9" opacity="0.5" transform="scale(1.2)"/>
  <use href="#star" x="780" y="220" fill="#E2C7FF" opacity="0.7" transform="scale(1.8)"/>
  <use href="#star" x="200" y="350" fill="#7B3CBF" opacity="0.4" transform="scale(1)"/>
  <use href="#star" x="620" y="420" fill="#E2C7FF" opacity="0.6" transform="scale(1.4)"/>
  <use href="#star" x="890" y="480" fill="#A86BD9" opacity="0.5" transform="scale(1.3)"/>
  <use href="#star" x="350" y="580" fill="#E2C7FF" opacity="0.7" transform="scale(1.6)"/>
  <use href="#star" x="680" y="650" fill="#7B3CBF" opacity="0.4" transform="scale(1.1)"/>
  <use href="#star" x="150" y="720" fill="#A86BD9" opacity="0.6" transform="scale(1.5)"/>
  <use href="#star" x="520" y="820" fill="#E2C7FF" opacity="0.5" transform="scale(1.2)"/>
  <use href="#star" x="850" y="880" fill="#A86BD9" opacity="0.6" transform="scale(1.7)"/>

  <!-- Glitter particles - Sparkles (circles) -->
  <use href="#sparkle" x="280" y="120" fill="#E2C7FF" opacity="0.5"/>
  <use href="#sparkle" x="560" y="240" fill="#A86BD9" opacity="0.6" transform="scale(1.2)"/>
  <use href="#sparkle" x="720" y="340" fill="#E2C7FF" opacity="0.4" transform="scale(0.8)"/>
  <use href="#sparkle" x="90" y="460" fill="#7B3CBF" opacity="0.5" transform="scale(1.1)"/>
  <use href="#sparkle" x="480" y="520" fill="#E2C7FF" opacity="0.6" transform="scale(1.3)"/>
  <use href="#sparkle" x="760" y="580" fill="#A86BD9" opacity="0.5"/>
  <use href="#sparkle" x="240" y="680" fill="#E2C7FF" opacity="0.7" transform="scale(1.4)"/>
  <use href="#sparkle" x="580" y="750" fill="#7B3CBF" opacity="0.4" transform="scale(0.9)"/>
  <use href="#sparkle" x="820" y="790" fill="#A86BD9" opacity="0.6" transform="scale(1.2)"/>
  <use href="#sparkle" x="380" y="890" fill="#E2C7FF" opacity="0.5" transform="scale(1.1)"/>

  <!-- Additional smaller sparkles for depth -->
  <use href="#sparkle" x="190" y="210" fill="#E2C7FF" opacity="0.3" transform="scale(0.6)"/>
  <use href="#sparkle" x="410" y="310" fill="#A86BD9" opacity="0.4" transform="scale(0.7)"/>
  <use href="#sparkle" x="650" y="450" fill="#E2C7FF" opacity="0.3" transform="scale(0.5)"/>
  <use href="#sparkle" x="300" y="550" fill="#7B3CBF" opacity="0.4" transform="scale(0.6)"/>
  <use href="#sparkle" x="530" y="640" fill="#A86BD9" opacity="0.3" transform="scale(0.7)"/>
  <use href="#sparkle" x="780" y="710" fill="#E2C7FF" opacity="0.4" transform="scale(0.5)"/>
  <use href="#sparkle" x="160" y="820" fill="#A86BD9" opacity="0.3" transform="scale(0.6)"/>
  <use href="#sparkle" x="690" y="920" fill="#E2C7FF" opacity="0.4" transform="scale(0.7)"/>
</svg>
